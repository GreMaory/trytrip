# TyTrip multi-database layout
#
#   catalog            central DB: tenants, users, memberships, roles, sessions, audit
#   primary            tenant shard "shard_one" (business data)
#   primary_shard_two  tenant shard "shard_two" (business data)
#   queue/cache/cable  Solid Queue / Solid Cache / Solid Cable
#
# Tenant shards are declared in config/shards.yml; every shard listed there
# must have a database config of the same name here. See docs/multi-tenancy.md.
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST") { "localhost" } %>
  port: <%= ENV.fetch("DATABASE_PORT") { 5432 } %>
  username: <%= ENV.fetch("DATABASE_USERNAME") { "postgres" } %>
  password: <%= ENV.fetch("DATABASE_PASSWORD") { "postgres" } %>

development:
  primary:
    <<: *default
    database: tytrip_shard_one
    migrations_paths: db/migrate
  primary_shard_two:
    <<: *default
    database: tytrip_shard_two
    migrations_paths: db/migrate
  catalog:
    <<: *default
    database: tytrip_catalog
    migrations_paths: db/catalog_migrate
  queue:
    <<: *default
    database: tytrip_back_queue
    migrations_paths: db/queue_migrate
  cache:
    <<: *default
    database: tytrip_back_cache
    migrations_paths: db/cache_migrate
  cable:
    <<: *default
    database: tytrip_back_cable
    migrations_paths: db/cable_migrate

# The test databases are wiped and recreated by the test suite.
test:
  primary:
    <<: *default
    database: tytrip_test_shard_one
    migrations_paths: db/migrate
  primary_shard_two:
    <<: *default
    database: tytrip_test_shard_two
    migrations_paths: db/migrate
  catalog:
    <<: *default
    database: tytrip_test_catalog
    migrations_paths: db/catalog_migrate

# Production credentials come from the environment, one URL per database.
production:
  primary:
    <<: *default
    url: <%= ENV["DATABASE_URL_SHARD_ONE"] %>
    migrations_paths: db/migrate
  primary_shard_two:
    <<: *default
    url: <%= ENV["DATABASE_URL_SHARD_TWO"] %>
    migrations_paths: db/migrate
  catalog:
    <<: *default
    url: <%= ENV["DATABASE_URL_CATALOG"] %>
    migrations_paths: db/catalog_migrate
  queue:
    <<: *default
    url: <%= ENV["DATABASE_URL_QUEUE"] %>
    migrations_paths: db/queue_migrate
  cache:
    <<: *default
    url: <%= ENV["DATABASE_URL_CACHE"] %>
    migrations_paths: db/cache_migrate
  cable:
    <<: *default
    url: <%= ENV["DATABASE_URL_CABLE"] %>
    migrations_paths: db/cable_migrate
